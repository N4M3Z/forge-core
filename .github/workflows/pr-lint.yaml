name: PR Lint

on:
    pull_request_target:
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read
    pull-requests: write

jobs:
    title:
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      docs
                      chore
                      refactor
                      test
                  requireScope: false
                  subjectPattern: ^(?![A-Z]).+$
                  subjectPatternError: >
                      The subject "{subject}" must start lowercase.

    label:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/labeler@v6
              with:
                  sync-labels: true
